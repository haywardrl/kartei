# Builds the native app for macOS, Windows and Linux whenever a version tag is
# pushed, and attaches the three archives to a GitHub release. Tests run first.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: Kartei-macos.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: Kartei-windows.zip
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: Kartei-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install the Wails CLI (same version as go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build
        working-directory: app
        run: wails build -platform ${{ matrix.platform }} -clean
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd app/build/bin && ditto -c -k --keepParent Kartei.app ../../../${{ matrix.artifact }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path app/build/bin/Kartei.exe -DestinationPath ${{ matrix.artifact }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C app/build/bin -czf ${{ matrix.artifact }} Kartei
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
